<style>

.btn{display:block;width:100%;font:700 1.05rem Rajdhani,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--priink);background:linear-gradient(180deg,var(--pri),var(--pri2));border:1px solid var(--pri2);border-radius:999px;padding:10px 16px;margin-top:12px;cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 3px 10px var(--sh),inset 0 1px 0 rgba(255,255,255,.55);transition:transform .15s}

.sb{fill:none;stroke:var(--line);stroke-width:1.5}.sd{fill:var(--cy)}.sl{fill:var(--mut);font:10px "Share Tech Mono",monospace}.wr{stroke:var(--cy);stroke-width:2;fill:none}

<script>
var D={1:{n:'Gerbang Rakit',b:'Mekanik',r:'Perakit'},2:{n:'Kode Pintu',b:'Pemrograman',r:'Programmer'},3:{n:'Sirkuit Sensor',b:'Elektronika',r:'Perangkai rangkaian'},4:{n:'Robot Rusak',b:'Troubleshooting',r:'Penguji'},5:{n:'Evakuasi',b:'Final: integrasi',r:'Penguji'}};
var CODE={1:'RAKIT',2:'KODE',3:'SIRKUIT',4:'DIAGNOSA',5:'EVAKUASI'};

try{var sv=localStorage.getItem('botx-state');if(sv)S=JSON.parse(sv)}catch(e){}

 for(var i=2;i<arguments.length;i++)[].concat(arguments[i]).forEach(function(x){if(x!=null)e.append(x)});return e}
function show(){var a=[];[].slice.call(arguments).forEach(function(x){a=a.concat(x)});app.replaceChildren.apply(app,a.filter(function(x){return x!=null&&x!==false}));window.scrollTo(0,0)}

function ring(n){var c=2*Math.PI*34,o=c*(1-n/5);return h('div',{class:'core',innerHTML:''},(function(){var d=document.createElement('div');d.innerHTML='<svg viewBox="0 0 84 84" role="img" aria-label="Pemulihan BOT-X '+n+' dari 5"><circle cx="42" cy="42" r="34" fill="none" stroke="var(--line)" stroke-width="7"/><circle cx="42" cy="42" r="34" fill="none" stroke="var(--cy)" stroke-width="7" stroke-dasharray="'+c+'" stroke-dashoffset="'+o+'" transform="rotate(-90 42 42)"/><text x="42" y="47" text-anchor="middle" class="mono" font-size="16" fill="var(--ink)">'+n+'/5</text></svg>';return d.firstChild})())}


// ===== PAPAN SKOR (live + manual) =====
var LIVE={db:null,uid:null,rows:{},st:'cek',w:''},onBoard=null;
function initLive(){
 if(!window.claude||!claude.use){LIVE.st='off';return}
 Promise.all([claude.use('db'),claude.use('user')]).then(function(r){
  var db=r[0],u=r[1];if(!db){LIVE.st='off';if(onBoard)onBoard();return}
  LIVE.db=db;
  var idp=(u&&u.id)?u.id().catch(function(){return null}):Promise.resolve(null);
  idp.then(function(id){LIVE.uid=id;push();
   db.collection('papan').onSnapshot(function(sn){LIVE.rows={};sn.docs.forEach(function(d){var x=d.data();if(x&&x.tim)LIVE.rows[d.id]=x});LIVE.st='live';if(onBoard)onBoard()},function(){LIVE.st='err';if(onBoard)onBoard()})})
 }).catch(function(){LIVE.st='off';if(onBoard)onBoard()})}
function push(){if(!LIVE.db||!LIVE.uid||!S.tim)return;var res={};for(var i in S.res)res[i]={v:S.res[i].v,pts:S.res[i].pts,hints:S.res[i].hints};
 LIVE.db.doc('papan/'+LIVE.uid).set({tim:S.tim,total:total(),res:res,t:Date.now()}).then(function(){LIVE.w='ok'},function(){LIVE.w='no'})}
function man(){try{return JSON.parse(localStorage.getItem('botx-manual')||'{}')}catch(e){return{}}}
function saveMan(o){try{localStorage.setItem('botx-manual',JSON.stringify(o))}catch(e){}}
function rows(){var m={},add=function(x,src){var k=String(x.tim).toLowerCase();if(!m[k]||(x.t||0)>=(m[k].t||0))m[k]={tim:x.tim,total:x.total||0,res:x.res||{},t:x.t||0,src:src}};
 for(var k in LIVE.rows)add(LIVE.rows[k],'live');var mm=man();for(var j in mm)add(mm[j],'manual');
 if(S.tim&&!m[S.tim.toLowerCase()])add({tim:S.tim,total:total(),res:S.res,t:0},'perangkat ini');
 return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.total-a.total||a.tim.localeCompare(b.tim)})}
function imp(txt){var o=man(),ok=0,bad=0;txt.split(/\r?\n/).forEach(function(l){l=l.trim();if(!l)return;var m=l.match(/TIM\|([^|]+)\|(\d+)\|([0-9A-Za-z,\-]+)/);if(!m){bad++;return}
 var ps=m[3].split(','),res={},tot=0,good=ps.length===5;
 ps.forEach(function(p,i){if(p==='0')return;var q=p.match(/^([DLT]+)-(\d+)-(\d+)$/);if(!q){good=false;return}res[i+1]={v:q[1],pts:+q[2],hints:+q[3]};tot+=+q[2]});
 if(!good){bad++;return}o[m[1].trim().toLowerCase()]={tim:m[1].trim(),total:tot,res:res,t:Date.now()};ok++});
 saveMan(o);return[ok,bad]}
function board(){
 var wrap=h('div',{}),st=h('p',{role:'status'}),msg=h('p',{role:'status'}),ta=h('textarea',{placeholder:'Tempel kode hasil tim: TIM|Nama|total|... (boleh langsung dari WhatsApp, satu baris satu tim)'});
 function draw(){
  st.textContent=LIVE.st==='live'?'● Live: tersambung, skor tim bergerak otomatis.':LIVE.st==='cek'?'Menyambung ke data live…':'Live tidak tersedia di perangkat ini. Isi skor dari kode hasil tim di kolom bawah.';
  st.className=LIVE.st==='live'?'ok':'mut';
  var r=rows();
  wrap.replaceChildren.apply(wrap,r.length?r.map(function(x,i){var n=Object.keys(x.res).length;
   return h('div',{class:'panel'},h('div',{class:'row'},h('h3',{},(i+1)+'. '+x.tim),h('span',{class:'mono hd'},x.total+' poin')),
    h('div',{class:'seg'},[1,2,3,4,5].map(function(m){var q=x.res[m];return h('div',{class:'sg'+(q?' on':''),title:'Misi '+m},h('b',{},'M'+m),h('span',{},q?q.v+' · '+q.pts:'—'))})),
    h('p',{class:'mut'},'Misi selesai '+n+' dari 5 · sumber: '+x.src))}):[h('p',{class:'mut'},'Belum ada tim di papan.')])}
 var ck={nm:h('input',{placeholder:'Nama tim'}),ms:sel([[1,'Misi 1'],[2,'Misi 2'],[3,'Misi 3'],[4,'Misi 4'],[5,'Misi 5']],1),out:h('div',{class:'rd'},'—')};
 function ckf(){var t=ck.nm.value.trim();ck.out.textContent=t?'Kode '+ck.ms.options[ck.ms.selectedIndex].text+' untuk "'+t+'": '+kd(+ck.ms.value,t):'—'}
 ck.nm.addEventListener('input',ckf);ck.ms.addEventListener('change',ckf);
 onBoard=draw;draw();
 show(h('p',{class:'mono am'},'// PAPAN SKOR KELAS'),h('h1',{},'Papan Skor'),st,wrap,
  h('div',{class:'panel'},h('h3',{},'Tambah skor dari kode hasil'),h('p',{class:'mut'},'Dipakai Penjaga Gerbang bila live tidak tersedia. Kode tim yang sama akan diperbarui.'),ta,
   h('button',{class:'btn',onclick:function(){var r=imp(ta.value);msg.className=r[1]?'bad':'ok';msg.textContent=r[0]+' tim ditambahkan'+(r[1]?', '+r[1]+' baris tidak terbaca':'')+'.';if(r[0])ta.value='';draw()}},'Tambahkan ke papan'),
   h('button',{class:'btn sec',onclick:function(){saveMan({});msg.className='mut';msg.textContent='Data manual dihapus.';draw()}},'Hapus data manual'),msg),
  h('div',{class:'panel'},h('h3',{},'Cek kode kunci tim'),h('p',{class:'mut'},'Untuk Penjaga Gerbang: kode kunci tiap tim berbeda. Isi nama tim persis seperti yang mereka tulis.'),ck.nm,ck.ms,ck.out),
  h('button',{class:'btn sec',onclick:function(){onBoard=null;(S.tim&&S.mem.length)?hub():intro()}},'Kembali'))}

function nextM(){for(var i=1;i<=5;i++)if(M[i]&&!S.res[i]){pick(i);return}hub()}
function intro(){
 var nm=h('input',{placeholder:'Contoh: Tim BOT-A',value:S.tim,autocomplete:'off'}),mm=h('textarea',{placeholder:'Satu nama per baris (4–5 orang)'}),er=h('p',{class:'bad',role:'alert'});

 show(h('p',{class:'mono am'},'// SISTEM DARURAT'),h('h1',{},'BOT-X Terkunci'),

  h('p',{},'Lab robotik terkunci. Sistem BOT-X kehilangan 5 kode pemulihan. Timmu adalah teknisi: selesaikan lima misi, kumpulkan kode, lalu buka peti BOT-X.'),
  h('p',{class:'mut'},'Pilih versi misi sesuai kekuatan timmu. Tiap misi berbatas '+(S.dur||30)+' menit. Kartu petunjuk boleh dipakai, tetapi mengurangi poin. Kamu melawan tantangan, bukan teman sekelas.')),
 h('details',{class:'panel',open:''},h('summary',{},'Cara bermain'),h('ol',{},['Satu perangkat untuk satu tim. Isi nama tim dan semua anggota.','Ada lima misi. Tiap misi punya tiga level: Dasar, Lanjutan, Tantangan. Pilih level sesuai kekuatan timmu.','Satu peran memimpin tiap misi, tetapi semua anggota harus ikut mengerjakan. Ketuk namamu saat kamu ikut.','Tekan “Periksa langkah” untuk mengecek jawaban. Kartu petunjuk membantu tetapi mengurangi 2 poin per kartu.','Setelah lolos, kamu boleh naik level untuk poin tambahan selama waktu misi masih ada.','Kode kunci tiap misi khusus untuk timmu. Tunjukkan ke Penjaga Gerbang.','Di akhir, kirim kode hasil tim ke guru.'].map(function(t){return h('li',{},t)}))),
 h('div',{class:'panel'},h('label',{},'Nama tim'),nm,h('label',{},'Anggota tim'),mm,er,
  h('button',{class:'btn',onclick:function(){var t=nm.value.trim(),m=mm.value.split('\n').map(function(x){return x.trim()}).filter(Boolean);
   if(!t||m.length<2){er.textContent='Isi nama tim dan minimal 2 anggota.';return}
   if(t!==S.tim){S.res={}}S.tim=t;S.mem=m;save();push();nextM()}},'Mulai')))}

function hub(){
 var n=nDone(),cards=[1,2,3,4,5].map(function(i){var r=S.res[i],rd=!!M[i];
  return h('div',{class:'panel'},h('div',{class:'row'},h('h3',{},'Misi '+i+' · '+D[i].n),h('span',{class:'st '+(r?'ok':rd?'go':'')},r?'SELESAI':rd?'SIAP':'SEGERA HADIR')),
   h('p',{class:'mut'},D[i].b+' · pemimpin: '+D[i].r),
   r?h('p',{},'Kode: ',h('b',{class:'mono ok'},kd(i)),' · level '+r.v.split('').map(function(x){return({D:'Dasar',L:'Lanjutan',T:'Tantangan'})[x]}).join(' → ')+' · '+r.pts+' poin'):null,
   rd&&!r?h('button',{class:'btn',onclick:function(){pick(i)}},'Mulai misi'):null)});

 show(h('div',{class:'row'},h('div',{},h('p',{class:'mono am'},'// '+S.tim),h('h1',{},'Pusat Kendali')),ring(n)),
  h('div',{class:'hp'},h('b',{},'BOT-X'),h('div',{class:'hpb',role:'img','aria-label':'Pemulihan '+n+' dari 5'},h('i',{style:'width:'+(n*20)+'%'})),h('span',{class:'mono'},n+'/5')),h('p',{},'Skor tim: ',h('b',{class:'mono'},String(total())),' poin · Anggota: '+S.mem.join(', ')),cards,
  n===5?h('div',{class:'panel'},h('h2',{class:'ok'},'Peti BOT-X terbuka'),h('p',{},'Kelima kode terkumpul. Lapor ke guru untuk menerima hadiah tim.')):null,
  h('div',{class:'panel'},h('h3',{},'Kode hasil tim'),h('p',{class:'rd'},kode()),h('p',{class:'mut'},'Kirim kode ini ke guru setelah semua misi yang dikerjakan selesai.'),cb,
   h('a',{class:'btn sec',target:'_blank',rel:'noopener',href:'https://wa.me/?text='+encodeURIComponent(kode())},'Kirim lewat WhatsApp')),
  h('button',{class:'btn',onclick:board},'Papan skor kelas'),h('button',{class:'btn sec',onclick:intro},'Ubah tim')) }

function pick(id){

function wiring(){
 var P=['— pilih —','3V3','VIN (5 V)','GND','GPIO 23','GPIO 25','GPIO 12 (pin boot)','GPIO 34 (input saja)','GPIO 35 (input saja)'],N=['VCC','TRIG','ECHO','GND'],ss=[],reads={},sy=function(i){return 35+i*45},ey=function(j){return 24+j*22};

 var ln=box.querySelectorAll('line'),dv=sel([['0','Echo langsung ke pin'],['1','Echo lewat pembagi tegangan (1 kΩ + 2 kΩ)']],'0'),

 return{el:h('div',{},box,h('div',{class:'g2'},sels),h('label',{},'Sambungan Echo'),dv,h('p',{class:'mut',style:'margin-top:10px'},'Setelah rangkaian benar, uji pembacaan:'),bt,out),

function ldr(cfg){
 var RL={t:2000,g:100000},got={},rf=sel([[220,'220 Ω'],[1000,'1 kΩ'],[4700,'4,7 kΩ'],[10000,'10 kΩ'],[47000,'47 kΩ'],[100000,'100 kΩ']],1000),

  test:function(){if(pin&&(pin.value==='b'||pin.value==='c'))return{ok:false,msg:'ADC2 tidak bisa dipakai saat WiFi aktif. Pindahkan LDR ke pin ADC1.'};
   if(!got.t||!got.g)return{ok:false,msg:'Ukur nilai saat terang dan gelap dulu.'};

function divider(){
